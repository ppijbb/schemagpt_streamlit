[project]
name = "schemagpt-streamlit"
version = "0.2.0"
description = "Streamlit resume and demo apps (healthcare, LLM, RAG, etc.)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # ── Web framework ──────────────────────────────────────────────────────────
    "setuptools>=74.1.1",
    "streamlit>=1.40.0",
    "streamlit-webrtc>=0.47.0",
    "streamlit_server_state",
    "streamlit-pdf-viewer",
    "streamlit-shap",
    "streamlit-mermaid",
    "streamlit-option-menu",
    "tornado>=6.4.1",
    # ── LangChain / LangGraph ─────────────────────────────────────────────────
    "langchain>=0.3.10",
    "langchain-community>=0.3.10",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-qdrant>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "langgraph>=0.2.0",
    # ── LLM / AI APIs ─────────────────────────────────────────────────────────
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "duckduckgo-search>=6.0.0",
    # ── Vector DBs ────────────────────────────────────────────────────────────
    "qdrant-client>=1.9.0",
    "chromadb",
    "rank_bm25>=0.2.2",
    "pysqlite3-binary",
    # ── Transformers / NLP ────────────────────────────────────────────────────
    "transformers",
    "sentence-transformers>=3.0.0",
    "sentencepiece",
    "accelerate>=0.30.0",
    "trl>=0.9.0",
    "tokenizers>=0.19.0",
    # ── ML / Data Science ────────────────────────────────────────────────────
    "scikit-learn>=1.4.0",
    "scikit-image>=0.24.0",
    "numpy>=1.26.2",
    "openpyxl",
    "plotly>=5.20.0",
    "shap>=0.45.0",
    "catboost",
    "lightgbm",
    "xgboost",
    "skorch",
    "tslearn",
    "modin[all]",
    # ── Deep Learning frameworks ──────────────────────────────────────────────
    "torch",
    "tensorflow>=2.17.0",
    "keras",
    "tf-keras",
    # ── Computer Vision ───────────────────────────────────────────────────────
    "opencv-python>=4.9.0.80",
    "opencv-contrib-python>=4.9.0.80",
    "opencv-python-headless>=4.9.0.80",
    "supervision>=0.21.0",
    # ── Audio ─────────────────────────────────────────────────────────────────
    "av",
    "librosa>=0.10.2",
    "pydub",
    "SpeechRecognition",
    # ── OCR ──────────────────────────────────────────────────────────────────
    "pytesseract",
    "easyocr",
    "paddlepaddle",
    "paddleocr",
    "python-bidi",
    # ── Inference acceleration ────────────────────────────────────────────────
    "onnx",
    "onnxruntime",
    "openvino",
    "optimum[openvino,nncf]",
    # ── Utils ─────────────────────────────────────────────────────────────────
    "wikipedia",
    "xmltodict",
    "ipython",
    "arxiv",
    "ray[all]",
    "selenium",
    "python-socketio",
    "slack-bolt",
    "pyvis",
    "inference-cpu",
]

[project.optional-dependencies]
neo4j = ["langchain-neo4j"]

[tool.uv.sources]
chromadb = { git = "https://github.com/ppijbb/dtw_chroma.git" }
transformers = { git = "https://github.com/huggingface/transformers.git" }

[tool.uv]
extra-index-url = []
